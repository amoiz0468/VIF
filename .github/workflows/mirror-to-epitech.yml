name: Mirror to Epitech Organization Repo

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  workflow_dispatch:

jobs:
  mirror:
    name: Mirror to Epitech Repo
    runs-on: ubuntu-latest
    # Only run on the personal repository (amoiz0468/VIF)
    if: github.repository == 'amoiz0468/VIF'
    steps:
      - name: Checkout full git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH Key
        if: env.SSH_KEY != ''
        env:
          SSH_KEY: ${{ secrets.EPITECH_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          echo "=== Testing SSH Key with GitHub ==="
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -T git@github.com || true

      - name: Push to Epitech via SSH
        if: env.SSH_KEY != ''
        env:
          SSH_KEY: ${{ secrets.EPITECH_SSH_PRIVATE_KEY }}
          GIT_SSH_COMMAND: "ssh -i /home/runner/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"
        run: |
          git remote add epitech git@github.com:EpitechMscInternationalPromo2027/I-YEP-800-INT-7-1-capstone-7.git || git remote set-url epitech git@github.com:EpitechMscInternationalPromo2027/I-YEP-800-INT-7-1-capstone-7.git
          git push epitech HEAD:refs/heads/main --force --tags

      - name: Fallback to Personal Access Token (if EPITECH_PAT is set)
        if: failure() && env.PAT_TOKEN != ''
        env:
          PAT_TOKEN: ${{ secrets.EPITECH_PAT }}
        run: |
          git remote add epitech-pat "https://x-access-token:${PAT_TOKEN}@github.com/EpitechMscInternationalPromo2027/I-YEP-800-INT-7-1-capstone-7.git" || git remote set-url epitech-pat "https://x-access-token:${PAT_TOKEN}@github.com/EpitechMscInternationalPromo2027/I-YEP-800-INT-7-1-capstone-7.git"
          git push epitech-pat HEAD:refs/heads/main --force --tags
