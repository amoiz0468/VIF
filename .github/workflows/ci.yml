name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        working-directory: ./backend
        run: pytest
      - name: Build Docker image
        working-directory: ./backend
        run: |
          docker build -t <your-docker-username>/app-backend:${{ github.sha }} .
      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo $DOCKER_PASSWORD | docker login ghcr.io -u $DOCKER_USERNAME --password-stdin
          docker tag <your-docker-username>/app-backend:${{ github.sha }} ghcr.io/<your-docker-username>/app-backend:${{ github.sha }}
          docker push ghcr.io/<your-docker-username>/app-backend:${{ github.sha }}
          docker tag ghcr.io/<your-docker-username>/app-backend:${{ github.sha }} ghcr.io/<your-docker-username>/app-backend:latest
          docker push ghcr.io/<your-docker-username>/app-backend:latest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Run lint & tests
        working-directory: ./frontend
        run: |
          npm run lint || true
          npm test -- --watchAll=false
      - name: Build Docker image
        working-directory: ./frontend
        run: |
          docker build -t <your-docker-username>/app-frontend:${{ github.sha }} .
      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo $DOCKER_PASSWORD | docker login ghcr.io -u $DOCKER_USERNAME --password-stdin
          docker tag <your-docker-username>/app-frontend:${{ github.sha }} ghcr.io/<your-docker-username>/app-frontend:${{ github.sha }}
          docker push ghcr.io/<your-docker-username>/app-frontend:${{ github.sha }}
          docker tag ghcr.io/<your-docker-username>/app-frontend:${{ github.sha }} ghcr.io/<your-docker-username>/app-frontend:latest
          docker push ghcr.io/<your-docker-username>/app-frontend:latest
